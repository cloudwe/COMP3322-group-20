
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - db_data:/var/lib/mysql
    networks:
      - freshtrack-net

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000" # exposes api so vm can reach it
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    depends_on:
      - db
    networks:
      - freshtrack-net

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80" # exposes the website to the public internet
    depends_on:
      - backend
    networks:
      - freshtrack-net

volumes:
  db_data:

networks:
  freshtrack-net:
    driver: bridge